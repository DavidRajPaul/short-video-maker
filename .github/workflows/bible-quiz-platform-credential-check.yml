name: Bible Quiz Platform Credential Probe (read-only)
on:
  push:
    branches: [feature/bible-quiz-publisher-staging]
    paths:
      - 'tools/bible-brain-teaser/check-publisher-credentials.mjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/check-publisher-credentials.mjs
