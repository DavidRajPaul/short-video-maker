name: Nov 25 publishing recovery audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'ops/nov25-publishing-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read delivery receipts and platform rejection details
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.N8N_API_KEY;
          if(!key)throw Error('n8n API secret unavailable');
          const root='https://meetdavidraj7.n8n-wsk.com/api/v1';
          async function get(p){
            const r=await fetch(root+p,{headers:{'X-N8N-API-KEY':key},signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('n8n API HTTP '+r.status);
            return r.json();
          }
          function classify(s){
            s=String(s||'');
            return ['invalid_grant','expired','OAuth','access token','permission','unauthorized','forbidden','quota','rate limit','invalid parameter','unsupported','not ready','processing','download','media','video','Unknown response','not confirmed','403','401','400','429','190','2207026'].filter(x=>s.toLowerCase().includes(x.toLowerCase()));
          }
          for(const id of ['2192','2193','2194','2197','2198','2199']){
            const d=await get('/executions/'+id+'?includeData=true');
            const nodes=d.data?.resultData?.runData||{};
            const out=n=>nodes[n]?.at(-1)?.data?.main?.[0]?.[0]?.json||{};
            const receipt=out('Normalize Actual Platform Outcome').publicResult||{};
            const detail=[];
            for(const n of ['Public YouTube Download ImageKit MP4','Public YouTube Upload','FB Reel Start Upload','FB Reel Upload Binary','FB Reel Finish Upload','Facebook Finish Uncertain','IG Create Container','IG Check Status','IG Normalize Status','Instagram Processing Uncertain']){
              if(!nodes[n])continue;
              const j=out(n),e=j.error||{};
              detail.push({node:n,keys:Object.keys(j),codes:[e.code,e.error_subcode,e.httpCode,j.statusCode,j.code].filter(x=>typeof x==='number'||/^\d{3,8}$/.test(String(x))),messageClasses:classify([typeof e==='string'?e:e.message,j.message,j.error_message,j.ig_fail_reason,j.fb_fail_reason].join(' ')),statusCode:typeof j.status_code==='string'&&/^[A-Z_]+$/.test(j.status_code)?j.status_code:null,remoteIdPresent:!!(j.id||j.video_id||j.fb_video_id||j.ig_container_id)});
            }
            console.log(JSON.stringify({execution:id,platform:receipt.platform,status:receipt.status,remoteId:/^[A-Za-z0-9_-]{6,32}$/.test(String(receipt.remoteId))?receipt.remoteId:null,errorClasses:classify(receipt.error),detail}));
          }
          NODE
