name: Read-only publisher contract inspection
on:
  pull_request:
    paths:
      - 'tools/bible-brain-teaser/inspect-shared-publisher.mjs'
      - '.github/workflows/inspect-shared-publisher.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/inspect-shared-publisher.mjs
