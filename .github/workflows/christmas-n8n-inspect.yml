name: Christmas n8n integration inspection
on:
  push:
    branches: [feature/christmas-n8n-integration]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scrubbed active n8n quiz contract only
        run: node tools/christmas-countdown/inspect-quiz-contract.mjs
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
  stage-inactive:
    if: contains(github.event.head_commit.message, '[christmas-stage]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --check tools/christmas-countdown/stage-n8n.mjs
      - name: Validate staged workflow contract without changes
        run: node tools/christmas-countdown/stage-n8n.mjs
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      - name: Create inactive Christmas staging workflow only
        run: node tools/christmas-countdown/stage-n8n.mjs
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          APPLY_STAGE: "true"
  production-preview:
    if: contains(github.event.head_commit.message, '[christmas-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Render Nov 22 Christmas preview (does not publish)
        run: node tools/christmas-countdown/test-renderer-preview.mjs
      - name: Install FFmpeg tools for media verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Require MP4 audio stream
        run: |
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 christmas-preview-2026-11-22.mp4 | grep -Eq 'codec_name=(aac|mp3|opus)'
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 christmas-preview-2026-11-22.mp4
      - name: Upload private-review video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-preview
          path: |
            christmas-preview-2026-11-22.mp4
            christmas-preview-cover.jpg
          retention-days: 7
  music-source-check:
    if: contains(github.event.head_commit.message, '[christmas-audio-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node tools/christmas-countdown/check-alternative-audio.mjs
  verify-existing-preview:
    if: contains(github.event.head_commit.message, '[christmas-existing-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node tools/christmas-countdown/verify-existing-video.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: christmas-preview-verified
          path: |
            christmas-preview-2026-11-22.mp4
            christmas-preview-cover.jpg
          retention-days: 7
