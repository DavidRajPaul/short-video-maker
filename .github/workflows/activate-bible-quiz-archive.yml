name: Activate Bible quiz 4PM archive safely
on:
  pull_request:
    paths:
      - '.github/workflows/activate-bible-quiz-archive.yml'
      - 'tools/bible-brain-teaser/activate-archive.mjs'
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/activate-archive.mjs
