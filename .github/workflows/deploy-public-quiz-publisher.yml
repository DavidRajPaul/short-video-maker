name: Deploy guarded public quiz publisher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      APPLY_PUBLIC: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/bible-brain-teaser/enable-public-publisher.mjs
      - run: node tools/bible-brain-teaser/enable-public-publisher.mjs
