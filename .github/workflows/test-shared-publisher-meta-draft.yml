name: Test shared publisher Meta draft ingestion (no public posting)
on:
  pull_request:
    paths:
      - '.github/workflows/test-shared-publisher-meta-draft.yml'
permissions:
  contents: read
jobs:
  meta-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/test-shared-publisher-meta-draft.mjs
