name: Verify 4 PM public production deployment (read-only)
on:
  pull_request:
    paths:
      - 'tools/bible-brain-teaser/verify-public-deployment.mjs'
      - '.github/workflows/verify-public-deployment.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/bible-brain-teaser/verify-public-deployment.mjs
      - run: node tools/bible-brain-teaser/verify-public-deployment.mjs
