name: Creator Studio contract and backend tests
on:
  pull_request:
    paths:
      - 'creator-studio/**'
      - '.github/workflows/creator-studio-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check creator-studio/server.mjs
          node --check creator-studio/n8n-bridge.mjs
          node --test creator-studio/*.test.mjs
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const html=readFileSync('creator-studio/index.html','utf8');
          const script=html.split('<script type="module">')[1].split('</script>')[0];
          writeFileSync('/tmp/studio-ui.mjs',script);
          NODE
          node --check /tmp/studio-ui.mjs
