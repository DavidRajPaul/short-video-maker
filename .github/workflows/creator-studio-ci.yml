name: Creator Studio contract tests
on:
  pull_request:
    paths:
      - 'creator-studio/**'
      - '.github/workflows/creator-studio-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test creator-studio/publisher-contract.test.mjs
