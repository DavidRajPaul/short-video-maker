name: Bible Quiz Publisher Inventory (Read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/bible-quiz-publisher-inventory.yml'
      - 'tools/bible-brain-teaser/inspect-publisher.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/inspect-publisher.mjs
