name: Connect 4 PM quiz to shared publisher safely
on:
  pull_request:
    paths:
      - 'tools/bible-brain-teaser/connect-quiz-shared-publisher.mjs'
      - '.github/workflows/connect-quiz-shared-publisher.yml'
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/bible-brain-teaser/connect-quiz-shared-publisher.mjs
      - run: node tools/bible-brain-teaser/connect-quiz-shared-publisher.mjs
