name: Private Bible Quiz ImageKit Archive Integration Test
on:
  push:
    branches: [feature/bible-quiz-publisher-staging]
    paths:
      - 'tools/bible-brain-teaser/test-imagekit-archive.mjs'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/test-imagekit-archive.mjs
