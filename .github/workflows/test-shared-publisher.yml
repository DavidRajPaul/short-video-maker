name: Test shared publisher dry-run (no uploads)
on:
  pull_request:
    paths:
      - 'tools/bible-brain-teaser/test-shared-publisher.mjs'
      - '.github/workflows/test-shared-publisher.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bible-brain-teaser/test-shared-publisher.mjs
