name: Deploy Bible quiz private draft to n8n

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-bible-quiz-draft.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Update ONLY the inactive six-node Bible quiz draft after a read-only preflight'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  sync-private-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check workflow contract
        run: node --test tools/bible-brain-teaser/*.test.mjs
      - name: Read-only API preflight
        id: preflight
        env:
          APPLY: 'false'
        run: node tools/bible-brain-teaser/sync-n8n-private.mjs
      - name: Apply to unpublished draft ONLY (push is explicitly preapproved)
        id: apply
        if: ${{ github.event_name == 'push' || inputs.apply == true }}
        env:
          APPLY: 'true'
        run: node tools/bible-brain-teaser/sync-n8n-private.mjs
      - name: Verify a real PRIVATE Bible quiz render and its audio/video streams
        if: ${{ github.event_name == 'push' || inputs.apply == true }}
        run: node tools/bible-brain-teaser/test-private-render.mjs
      - name: Emit GitHub commit status for verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const state = process.env.SYNC_RESULT === 'success' ? 'success' : 'failure';
          const response = await fetch('https://api.github.com/repos/' + repo + '/statuses/' + sha, {
            method:'POST',
            headers:{
              authorization:'Bearer ' + process.env.GH_TOKEN,
              accept:'application/vnd.github+json',
              'content-type':'application/json',
              'x-github-api-version':'2022-11-28'
            },
            body:JSON.stringify({
              state,context:'bible-quiz-n8n-sync',
              description:state === 'success' ? 'Private n8n draft sync validated' : 'Private n8n draft sync failed; see Actions',
              target_url:'https://github.com/' + repo + '/actions/runs/' + process.env.GITHUB_RUN_ID
            })
          });
          if(!response.ok) throw new Error('GitHub commit status failed: '+response.status);
          JS
