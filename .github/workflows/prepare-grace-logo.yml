name: Janet video YouTube publication
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: grace-janet-youtube-20261125
  cancel-in-progress: false
jobs:
  publish:
    if: github.head_ref == 'ops/janet-comfort-video-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Upload approved video via existing YouTube publisher
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {randomUUID,randomBytes} from 'node:crypto';
          const key=process.env.N8N_API_KEY;
          if(!key)throw Error('Missing existing n8n credential');
          const host='https://meetdavidraj7.n8n-wsk.com',root=host+'/api/v1';
          const nap=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(p,method='GET',body){
            const r=await fetch(root+p,{method,headers:{'X-N8N-API-KEY':key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw Error('n8n '+method+' HTTP '+r.status);
            return r.status===204?{}:await r.json();
          }
          async function run(){
          const name='TEMP Grace Janet YouTube only 2026-11-25';
          const list=(await api('/workflows?limit=100')).data||[];
          if(list.some(w=>w.name===name))throw Error('Prior attempt exists; reconcile before retry');
          const url='https://drive.google.com/uc?export=download&id=1G6EOz43ivXCjBiXRMXLIkKLKXvodsM_U';
          const r=await fetch(url,{signal:AbortSignal.timeout(45000)});
          const bytes=Buffer.from(await r.arrayBuffer());
          if(!r.ok||bytes.length!==3168242||bytes.subarray(4,8).toString()!=='ftyp')throw Error('Public media verification failed');
          console.log('Approved MP4 verified');
          const shared=await api('/workflows/UyXSFUjWdkjuqK1p');
          if(!shared.activeVersionId||shared.nodes.length!==58)throw Error('Unexpected shared publisher configuration');
          const nodes=structuredClone(shared.nodes),connections=structuredClone(shared.connections);
          const trigger=nodes.find(n=>n.name==='When called by a content slot');
          const normal=nodes.find(n=>n.name==='Normalize Publishing Input');
          if(!trigger||!normal||nodes.some(n=>/webhook|scheduleTrigger/.test(n.type)))throw Error('Unexpected trigger');
          const slug='grace-janet-yt-'+randomUUID(),proof=randomBytes(32).toString('hex');
          Object.assign(trigger,{type:'n8n-nodes-base.webhook',typeVersion:2.1,webhookId:randomUUID(),parameters:{httpMethod:'POST',path:slug,responseMode:'onReceived',options:{}}});
          const title='Jesus Sees the Tears Nobody Else Sees ❤️';
          const description='Some tears fall in silence. Some pain is hidden behind a smile. But not a single tear goes unnoticed by Jesus. ❤️\n\nEven when you feel completely alone, He is closer than you know.\n\nInspired by Psalm 34:18 and Psalm 56:8.\n\nShare this with someone who needs a little hope today.\n\nCreated by Janet for Grace In A Minute.\nAI-generated animation using Gemini.\n\n#JesusLovesYou #GodSeesYou #ChristianShorts #Faith #GodsLove #JesusChrist #Hope #GraceInAMinute #Shorts';
          const input={publisherInput:{contentId:'janet-tears-2026-11-25',contentType:'manual_video',videoUrl:url,title,description,tags:['Jesus Christ','Christian Shorts','Faith','Hope','Grace In A Minute'],mode:'publishYouTube'}};
          const lines=normal.parameters.jsCode.split('\n');
          const i=lines.findIndex(l=>l.includes('Expected a permanent HTTPS ImageKit MP4')),j=lines.findIndex(l=>l.includes('const raw='));
          if(i<0||j<0)throw Error('Publisher input guard changed');
          lines[i]='if(url!=='+JSON.stringify(url)+')throw new Error("Unexpected media URL");';
          lines[j]='const req=$input.first()?.json??{};if(req.headers?.["x-grace-proof"]!=='+JSON.stringify(proof)+')throw Error("Unauthorized");const raw='+JSON.stringify(input)+';';
          normal.parameters.jsCode=lines.join('\n');
          const w=await api('/workflows','POST',{name,nodes,connections,settings:{timezone:'Asia/Kolkata',executionOrder:'v1'}});
          const id=w.id;
          console.log('Temporary workflow '+id);
          try{
            await api('/workflows/'+id+'/publish','POST');
            await nap(4000);
            const t=await fetch(host+'/webhook/'+slug,{method:'POST',headers:{'Content-Type':'application/json','x-grace-proof':proof},body:'{}',signal:AbortSignal.timeout(25000)});
            if(!t.ok)throw Error('Upload invocation HTTP '+t.status);
            for(let k=0;k<60;k++){
              await nap(5000);
              const e=(await api('/executions?workflowId='+id+'&limit=5')).data?.[0];
              if(!e||!['success','error','crashed','canceled'].includes(e.status))continue;
              const d=await api('/executions/'+e.id+'?includeData=true');
              const rd=d.data?.resultData||{},rs=rd.runData||{};
              const receipt=rs['Return Per-Platform Publish Receipt']?.at(-1)?.data?.main?.[0]?.[0]?.json||{};
              console.log(JSON.stringify({execution:e.id,status:receipt.status||'unconfirmed',remoteId:receipt.remoteId||null,url:receipt.remoteUrl||null,lastNode:rd.lastNodeExecuted||null}));
              if(receipt.status!=='published'||!receipt.remoteId)throw Error('YouTube delivery not confirmed; do not blindly retry');
              return;
            }
            throw Error('Execution timed out; reconcile before retry');
          }finally{try{await api('/workflows/'+id+'/unpublish','POST');console.log('Temporary workflow unpublished')}catch{console.log('Cleanup needs inspection '+id)}}
          }
          await run();
          NODE
