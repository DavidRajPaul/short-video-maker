name: Stage Bible Quiz Cloudinary Archive (NO social publishing)
on:
  push:
    branches: [feature/bible-quiz-publisher-staging]
    paths:
      - 'tools/bible-brain-teaser/build-publisher-staging.mjs'
permissions:
  contents: read
jobs:
  create-inactive-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate builder syntax
        run: node --check tools/bible-brain-teaser/build-publisher-staging.mjs
      - name: Stage separate inactive quiz archive workflow with DISCONNECTED social branches
        run: node tools/bible-brain-teaser/build-publisher-staging.mjs
